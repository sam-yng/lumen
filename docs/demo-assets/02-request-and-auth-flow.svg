<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="820" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">Lumen request and authentication flow</title>
  <desc id="desc">A browser request passes through the Next.js proxy, route handler, service layer, and Supabase with row-level security.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#6b5ce7"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#251f52" flood-opacity=".12"/>
    </filter>
    <style>
      .bg { fill: #f7f6fd; }
      .card { fill: #fff; stroke: #dedaf4; stroke-width: 2; filter: url(#shadow); }
      .secure { fill: #eef8f3; stroke: #b5dfc8; stroke-width: 2; filter: url(#shadow); }
      .title { font: 700 36px ui-sans-serif, system-ui, sans-serif; fill: #27233b; }
      .sub { font: 400 19px ui-sans-serif, system-ui, sans-serif; fill: #69637d; }
      .h { font: 700 23px ui-sans-serif, system-ui, sans-serif; fill: #27233b; }
      .body { font: 400 17px ui-sans-serif, system-ui, sans-serif; fill: #555064; }
      .small { font: 600 15px ui-monospace, SFMono-Regular, monospace; fill: #6b5ce7; }
      .num { font: 700 17px ui-sans-serif, system-ui, sans-serif; fill: #fff; }
      .arrow { fill: none; stroke: #6b5ce7; stroke-width: 4; marker-end: url(#arrow); }
      .dashed { fill: none; stroke: #7b7591; stroke-width: 3; stroke-dasharray: 8 8; marker-end: url(#arrow); }
      .pill { fill: #6b5ce7; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="820"/>
  <text class="title" x="72" y="78">What happens after a user clicks in Lumen</text>
  <text class="sub" x="72" y="112">The UI is thin; authorization and domain rules are repeated at safer boundaries.</text>

  <rect class="card" x="60" y="210" rx="22" width="240" height="250"/>
  <circle class="pill" cx="92" cy="243" r="17"/><text class="num" x="87" y="249">1</text>
  <text class="h" x="120" y="252">Browser</text>
  <text class="body" x="88" y="302">React client component</text>
  <text class="body" x="88" y="335">TanStack Query cache</text>
  <text class="body" x="88" y="368">Cookie session</text>
  <text class="small" x="88" y="420">LibraryWorkspace</text>

  <rect class="card" x="370" y="210" rx="22" width="250" height="250"/>
  <circle class="pill" cx="402" cy="243" r="17"/><text class="num" x="397" y="249">2</text>
  <text class="h" x="430" y="252">Next.js 16</text>
  <text class="body" x="398" y="302">Proxy refreshes session</text>
  <text class="body" x="398" y="335">Route validates with Zod</text>
  <text class="body" x="398" y="368">Server re-checks user</text>
  <text class="small" x="398" y="420">app/api/** + proxy.ts</text>

  <rect class="card" x="690" y="210" rx="22" width="260" height="250"/>
  <circle class="pill" cx="722" cy="243" r="17"/><text class="num" x="717" y="249">3</text>
  <text class="h" x="750" y="252">Service layer</text>
  <text class="body" x="718" y="302">Receives userId + client</text>
  <text class="body" x="718" y="335">Applies domain rules</text>
  <text class="body" x="718" y="368">Reusable by UI + MCP</text>
  <text class="small" x="718" y="420">server/services/**</text>

  <rect class="secure" x="1020" y="168" rx="22" width="350" height="334"/>
  <circle class="pill" cx="1052" cy="201" r="17"/><text class="num" x="1047" y="207">4</text>
  <text class="h" x="1080" y="210">Supabase</text>
  <text class="body" x="1048" y="260">Auth verifies the JWT</text>
  <text class="body" x="1048" y="300">Postgres stores app data</text>
  <text class="body" x="1048" y="340">Storage holds private files</text>
  <rect x="1048" y="374" rx="12" width="292" height="82" fill="#dff2e8"/>
  <text class="h" x="1070" y="407">RLS is the boundary</text>
  <text class="body" x="1070" y="438">auth.uid() must own each row</text>

  <path class="arrow" d="M300 335 H350"/>
  <path class="arrow" d="M620 335 H670"/>
  <path class="arrow" d="M950 335 H1000"/>

  <rect class="card" x="220" y="585" rx="18" width="1000" height="138"/>
  <text class="h" x="258" y="625">Why two auth checks?</text>
  <text class="body" x="258" y="659">Proxy gives good navigation behavior. The protected Server Component verifies again.</text>
  <text class="body" x="258" y="690">RLS is the final data guard, so an app bug should not expose another user's rows.</text>
  <path class="dashed" d="M1120 585 C1120 540 1185 535 1185 505"/>
</svg>
