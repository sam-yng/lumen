<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Lumen batch audio transcription flow</title>
  <desc id="desc">An audio upload is stored, queued with pg-boss, processed by a separate worker, and written back as transcript segments.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b5ce7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#251f52" flood-opacity=".12"/></filter>
    <style>
      .bg { fill: #f7f6fd; } .card { fill:#fff; stroke:#dedaf4; stroke-width:2; filter:url(#shadow); }
      .worker { fill:#fff8ea; stroke:#eed39a; stroke-width:2; filter:url(#shadow); }
      .risk { fill:#fff0f0; stroke:#edbbbb; stroke-width:2; }
      .title { font:700 36px ui-sans-serif,system-ui,sans-serif; fill:#27233b; }
      .sub { font:400 19px ui-sans-serif,system-ui,sans-serif; fill:#69637d; }
      .h { font:700 22px ui-sans-serif,system-ui,sans-serif; fill:#27233b; }
      .body { font:400 16px ui-sans-serif,system-ui,sans-serif; fill:#555064; }
      .mono { font:600 14px ui-monospace,SFMono-Regular,monospace; fill:#6b5ce7; }
      .arrow { fill:none; stroke:#6b5ce7; stroke-width:4; marker-end:url(#arrow); }
      .back { fill:none; stroke:#2a9d70; stroke-width:4; marker-end:url(#arrow); }
      .num { font:700 16px ui-sans-serif,system-ui,sans-serif; fill:#fff; }
      .pill { fill:#6b5ce7; }
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text class="title" x="70" y="70">Batch transcription: request → queue → worker → transcript</text>
  <text class="sub" x="70" y="105">The slow CPU work is outside the web request so the UI stays responsive.</text>

  <rect class="card" x="50" y="180" rx="20" width="220" height="205"/>
  <circle class="pill" cx="82" cy="213" r="16"/><text class="num" x="77" y="219">1</text>
  <text class="h" x="110" y="221">Upload UI</text>
  <text class="body" x="78" y="268">PDF or audio only</text>
  <text class="body" x="78" y="299">multipart/form-data</text>
  <text class="mono" x="78" y="345">/api/library/uploads</text>

  <rect class="card" x="335" y="150" rx="20" width="270" height="265"/>
  <circle class="pill" cx="367" cy="183" r="16"/><text class="num" x="362" y="189">2</text>
  <text class="h" x="395" y="191">Authenticated route</text>
  <text class="body" x="363" y="238">Validate parent + MIME</text>
  <text class="body" x="363" y="269">Rate-limit audio enqueue</text>
  <text class="body" x="363" y="300">Create audio node</text>
  <text class="body" x="363" y="331">Create “pending” recording</text>
  <text class="mono" x="363" y="377">createUploadedFile()</text>

  <rect class="card" x="680" y="125" rx="20" width="270" height="145"/>
  <circle class="pill" cx="712" cy="158" r="16"/><text class="num" x="707" y="164">3</text>
  <text class="h" x="740" y="166">Supabase Storage</text>
  <text class="body" x="708" y="211">Private library-files bucket</text>
  <text class="mono" x="708" y="240">userId/generated-name</text>

  <rect class="card" x="680" y="315" rx="20" width="270" height="145"/>
  <circle class="pill" cx="712" cy="348" r="16"/><text class="num" x="707" y="354">4</text>
  <text class="h" x="740" y="356">pg-boss</text>
  <text class="body" x="708" y="401">Job stored in Postgres</text>
  <text class="mono" x="708" y="430">transcribe-recording</text>

  <rect class="worker" x="1020" y="135" rx="22" width="350" height="410"/>
  <circle class="pill" cx="1052" cy="168" r="16"/><text class="num" x="1047" y="174">5</text>
  <text class="h" x="1080" y="176">Separate worker process</text>
  <text class="body" x="1048" y="222">1. Mark “processing”</text>
  <text class="body" x="1048" y="256">2. Download audio to /tmp</text>
  <text class="body" x="1048" y="290">3. Optional sherpa diarization</text>
  <text class="body" x="1048" y="324">4. nodejs-whisper transcription</text>
  <text class="body" x="1048" y="358">5. Write transcript + segments</text>
  <text class="body" x="1048" y="392">6. Mark “done” or “failed”</text>
  <text class="body" x="1048" y="426">7. Delete temp audio</text>
  <text class="mono" x="1048" y="486">worker/transcription-worker.ts</text>

  <path class="arrow" d="M270 282 H315"/>
  <path class="arrow" d="M605 245 C640 245 640 200 660 200"/>
  <path class="arrow" d="M605 325 C640 325 640 385 660 385"/>
  <path class="arrow" d="M950 385 C988 385 988 340 1000 340"/>

  <rect class="card" x="120" y="620" rx="20" width="620" height="180"/>
  <text class="h" x="152" y="660">UI feedback loop</text>
  <text class="body" x="152" y="698">TanStack Query reloads the library/transcript data.</text>
  <text class="body" x="152" y="732">The user sees pending → processing → done/failed.</text>
  <text class="body" x="152" y="766">Clicking a segment seeks the real audio player.</text>

  <rect class="risk" x="820" y="620" rx="20" width="500" height="180"/>
  <text class="h" x="852" y="660">Security sentence to remember</text>
  <text class="body" x="852" y="698">The worker uses the Supabase secret role, so it bypasses RLS.</text>
  <text class="body" x="852" y="732">Every worker query must include the trusted job’s userId.</text>
  <text class="body" x="852" y="766">The route derives that userId; the browser never supplies it.</text>

  <path class="back" d="M1190 565 C1190 590 740 590 740 680"/>
</svg>
