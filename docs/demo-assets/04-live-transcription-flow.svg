<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Lumen live transcription flow</title>
  <desc id="desc">Microphone audio is recorded and transcribed in a browser worker, then segments and final audio are sent to the server.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b5ce7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#251f52" flood-opacity=".12"/></filter>
    <style>
      .bg{fill:#f7f6fd}.card{fill:#fff;stroke:#dedaf4;stroke-width:2;filter:url(#shadow)}
      .browser{fill:#f0edff;stroke:#c9c0fb;stroke-width:2;filter:url(#shadow)}
      .server{fill:#eef8f3;stroke:#b5dfc8;stroke-width:2;filter:url(#shadow)}
      .title{font:700 36px ui-sans-serif,system-ui,sans-serif;fill:#27233b}.sub{font:400 19px ui-sans-serif,system-ui,sans-serif;fill:#69637d}
      .h{font:700 22px ui-sans-serif,system-ui,sans-serif;fill:#27233b}.body{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#555064}
      .mono{font:600 14px ui-monospace,SFMono-Regular,monospace;fill:#6b5ce7}.arrow{fill:none;stroke:#6b5ce7;stroke-width:4;marker-end:url(#arrow)}
      .num{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:#fff}.pill{fill:#6b5ce7}.label{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:#6b5ce7}
    </style>
  </defs>
  <rect class="bg" width="1440" height="900"/>
  <text class="title" x="70" y="70">Live transcription: Whisper runs inside the browser</text>
  <text class="sub" x="70" y="105">Audio and text follow two paths, then meet when the session is finalized.</text>

  <rect class="browser" x="55" y="165" rx="24" width="800" height="410"/>
  <text class="label" x="82" y="200">BROWSER</text>

  <rect class="card" x="90" y="235" rx="18" width="190" height="220"/>
  <circle class="pill" cx="120" cy="266" r="15"/><text class="num" x="115" y="272">1</text>
  <text class="h" x="147" y="274">Microphone</text>
  <text class="body" x="118" y="318">getUserMedia()</text>
  <text class="body" x="118" y="349">MediaRecorder</text>
  <text class="body" x="118" y="380">PCM capture</text>
  <text class="mono" x="118" y="422">audio/webm</text>

  <rect class="card" x="345" y="225" rx="18" width="245" height="240"/>
  <circle class="pill" cx="375" cy="256" r="15"/><text class="num" x="370" y="262">2</text>
  <text class="h" x="402" y="264">Web Worker</text>
  <text class="body" x="373" y="309">Transformers.js Whisper</text>
  <text class="body" x="373" y="340">WebGPU → WASM fallback</text>
  <text class="body" x="373" y="371">12-second windows</text>
  <text class="body" x="373" y="402">Interim + final text</text>
  <text class="mono" x="373" y="438">asr-worker.ts</text>

  <rect class="card" x="655" y="235" rx="18" width="165" height="220"/>
  <circle class="pill" cx="685" cy="266" r="15"/><text class="num" x="680" y="272">3</text>
  <text class="h" x="712" y="274">Live UI</text>
  <text class="body" x="683" y="318">Timer</text>
  <text class="body" x="683" y="349">Model status</text>
  <text class="body" x="683" y="380">Transcript text</text>
  <text class="body" x="683" y="411">Stop &amp; save</text>

  <path class="arrow" d="M280 345 H325"/>
  <path class="arrow" d="M590 345 H635"/>

  <rect class="server" x="920" y="145" rx="24" width="460" height="490"/>
  <text class="label" x="950" y="180">NEXT.JS + SUPABASE</text>
  <rect class="card" x="955" y="215" rx="18" width="390" height="150"/>
  <circle class="pill" cx="985" cy="246" r="15"/><text class="num" x="980" y="252">4</text>
  <text class="h" x="1012" y="254">During recording</text>
  <text class="body" x="983" y="298">Append finalized segments to Postgres</text>
  <text class="mono" x="983" y="332">POST .../segments</text>

  <rect class="card" x="955" y="420" rx="18" width="390" height="175"/>
  <circle class="pill" cx="985" cy="451" r="15"/><text class="num" x="980" y="457">5</text>
  <text class="h" x="1012" y="459">When the user stops</text>
  <text class="body" x="983" y="502">Upload final WebM to private Storage</text>
  <text class="body" x="983" y="533">Combine segments; mark recording done</text>
  <text class="body" x="983" y="564">Optionally enqueue speaker labeling</text>

  <path class="arrow" d="M820 305 C870 305 870 290 935 290"/>
  <path class="arrow" d="M820 410 C875 410 875 505 935 505"/>

  <rect class="card" x="150" y="685" rx="20" width="1140" height="135"/>
  <text class="h" x="182" y="726">The key difference from batch upload</text>
  <text class="body" x="182" y="765">Live speech-to-text happens on the user’s device. Batch audio is uploaded first and transcribed by the separate worker.</text>
  <text class="body" x="182" y="795">Live audio is still uploaded to Supabase when the user saves, so “local inference” does not mean “nothing leaves the browser.”</text>
</svg>
