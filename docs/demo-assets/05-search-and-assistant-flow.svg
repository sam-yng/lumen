<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="850" viewBox="0 0 1440 850" role="img" aria-labelledby="title desc">
  <title id="title">Lumen search and assistant flow</title>
  <desc id="desc">The normal search UI uses lexical database search, while the assistant uses the same MCP service contract as external clients and validates citations.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#6b5ce7"/></marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#251f52" flood-opacity=".12"/></filter>
    <style>
      .bg{fill:#f7f6fd}.card{fill:#fff;stroke:#dedaf4;stroke-width:2;filter:url(#shadow)}.accent{fill:#f0edff;stroke:#c9c0fb;stroke-width:2;filter:url(#shadow)}
      .title{font:700 36px ui-sans-serif,system-ui,sans-serif;fill:#27233b}.sub{font:400 19px ui-sans-serif,system-ui,sans-serif;fill:#69637d}
      .h{font:700 22px ui-sans-serif,system-ui,sans-serif;fill:#27233b}.body{font:400 16px ui-sans-serif,system-ui,sans-serif;fill:#555064}
      .mono{font:600 14px ui-monospace,SFMono-Regular,monospace;fill:#6b5ce7}.arrow{fill:none;stroke:#6b5ce7;stroke-width:4;marker-end:url(#arrow)}
      .divider{stroke:#d7d2ed;stroke-width:2}.label{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:#6b5ce7}
    </style>
  </defs>
  <rect class="bg" width="1440" height="850"/>
  <text class="title" x="70" y="70">Search and assistant: related data, different request paths</text>
  <text class="sub" x="70" y="105">This distinction is useful if an interviewer asks what “semantic search” currently means.</text>
  <line class="divider" x1="720" y1="145" x2="720" y2="760"/>

  <text class="label" x="90" y="180">NORMAL SEARCH UI</text>
  <rect class="card" x="80" y="220" rx="20" width="230" height="175"/>
  <text class="h" x="110" y="260">SearchPanel</text>
  <text class="body" x="110" y="300">250 ms debounce</text>
  <text class="body" x="110" y="331">TanStack Query</text>
  <text class="mono" x="110" y="365">GET /api/search?q=</text>

  <rect class="card" x="390" y="220" rx="20" width="250" height="260"/>
  <text class="h" x="420" y="260">Postgres queries</text>
  <text class="body" x="420" y="300">Page body FTS</text>
  <text class="body" x="420" y="331">Transcript FTS</text>
  <text class="body" x="420" y="362">Title/file ILIKE</text>
  <text class="body" x="420" y="411">Merge + rank in TypeScript</text>
  <text class="mono" x="420" y="447">searchLibrary()</text>
  <path class="arrow" d="M310 310 H370"/>

  <rect class="accent" x="165" y="555" rx="20" width="475" height="145"/>
  <text class="h" x="195" y="595">Honest current-state answer</text>
  <text class="body" x="195" y="633">The service supports pgvector when an embedding provider</text>
  <text class="body" x="195" y="662">is injected. The default /api/search route is lexical today.</text>

  <text class="label" x="770" y="180">IN-APP ASSISTANT</text>
  <rect class="card" x="760" y="220" rx="20" width="205" height="205"/>
  <text class="h" x="790" y="260">Assistant UI</text>
  <text class="body" x="790" y="300">User’s Claude key</text>
  <text class="body" x="790" y="331">stored in Vault</text>
  <text class="mono" x="790" y="382">POST /api/assistant</text>

  <rect class="card" x="1030" y="195" rx="20" width="320" height="280"/>
  <text class="h" x="1060" y="235">Server-side tool loop</text>
  <text class="body" x="1060" y="275">Claude selects MCP tools</text>
  <text class="body" x="1060" y="306">In-memory MCP transport</text>
  <text class="body" x="1060" y="337">Same services as external MCP</text>
  <text class="body" x="1060" y="386">Max 8 iterations</text>
  <text class="body" x="1060" y="417">Validate [S#] citations</text>
  <text class="mono" x="1060" y="451">runAssistant()</text>
  <path class="arrow" d="M965 320 H1010"/>

  <rect class="accent" x="790" y="555" rx="20" width="520" height="145"/>
  <text class="h" x="820" y="595">Why MCP inside the app?</text>
  <text class="body" x="820" y="633">The UI assistant and external AI hosts use one tool contract.</text>
  <text class="body" x="820" y="662">That avoids duplicating permissions and domain logic.</text>
</svg>
